name: Playwright Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:

  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Check Python
      # --------------------------------------------------
      - name: Check Python
        run: |
          python --version
          python -m pip --version

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: playwright_webautomation/22_pytest_framework_opencart
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # --------------------------------------------------
      # Verify pytest
      # --------------------------------------------------
      - name: Verify pytest
        working-directory: playwright_webautomation/22_pytest_framework_opencart
        run: |
          python --version
          python -m pip --version
          python -m pytest --version

      # --------------------------------------------------
      # Create .env
      # --------------------------------------------------
      - name: Create .env file
        working-directory: playwright_webautomation/22_pytest_framework_opencart
        run: |
          cat > .env << EOF

          # UAT
          UAT_USERNAME="${{ secrets.UAT_USERNAME }}"
          UAT_PASSWORD="${{ secrets.UAT_PASSWORD }}"
          UAT_BASE_URL="${{ secrets.UAT_BASE_URL }}"

          # DEV
          DEV_USERNAME="${{ secrets.DEV_USERNAME }}"
          DEV_PASSWORD="${{ secrets.DEV_PASSWORD }}"
          DEV_BASE_URL="${{ secrets.DEV_BASE_URL }}"

          # PREPROD
          PREPROD_USERNAME="${{ secrets.PREPROD_USERNAME }}"
          PREPROD_PASSWORD="${{ secrets.PREPROD_PASSWORD }}"
          PREPROD_BASE_URL="${{ secrets.PREPROD_BASE_URL }}"

          EOF

      # --------------------------------------------------
      # Run pytest
      # --------------------------------------------------
      - name: Run tests
        working-directory: playwright_webautomation/22_pytest_framework_opencart
        run: |
          python -m pytest \
            --browser chromium \
            --env uat \
            -m sanity \
            --alluredir=reports/allure-results \
            --clean-alluredir

      # --------------------------------------------------
      # Install Allure CLI
      # --------------------------------------------------
      - name: Install Allure
        if: always()
        run: |
          apt-get update
          apt-get install -y wget default-jre

          wget -q https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz

          tar -xzf allure-2.35.1.tgz -C /opt

          ln -s /opt/allure-2.35.1/bin/allure /usr/local/bin/allure

      # --------------------------------------------------
      # Generate Allure HTML report
      # --------------------------------------------------
      - name: Generate Allure report
        if: always()
        working-directory: playwright_webautomation/22_pytest_framework_opencart
        run: |
          allure generate reports/allure-results \
            --clean \
            -o reports/allure-report

      # --------------------------------------------------
      # Upload Allure results
      # --------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: playwright_webautomation/22_pytest_framework_opencart/reports/allure-results
          retention-days: 7

      # --------------------------------------------------
      # Upload Allure HTML report
      # --------------------------------------------------
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: playwright_webautomation/22_pytest_framework_opencart/reports/allure-report
          retention-days: 7